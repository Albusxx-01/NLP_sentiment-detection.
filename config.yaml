data:
  raw_path: data/raw/Sarcasm_Headlines_Dataset.json
  processed_path: data/processed/dataset.parquet
  train_subset: 5000
  val_subset: 1000
  test_subset: 1000

dataset:
  text_col: headline
  label_col: is_sarcastic
  classes:
    0: not_sarcastic
    1: sarcastic

tokenizer:
  name: distilbert-base-uncased
  max_length: 128

model:
  name: distilbert-base-uncased
  num_labels: 2
  checkpoint_dir: models/checkpoint

training:
  epochs: 2
  batch_size: 16
  learning_rate: 2e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  seed: 42
  fp16: false

evaluation:
  target_f1: 0.85
  report_dir: reports

app:
  host: 127.0.0.1
  port: 8501